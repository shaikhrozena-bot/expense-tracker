<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Dashboard | Shaikh Rozena</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>

        <h1>
            <i class="fa-solid fa-wallet"></i>
            Personal Finance Dashboard
        </h1>

        <p>Track your income and expenses with ease.</p>

    </header>

    <!-- Summary Cards -->

    <section class="summary">

        <div class="card balance">

            <i class="fa-solid fa-wallet card-icon"></i>

            <p>Total Balance</p>

            <h2>₹ <span id="balance">0</span></h2>

        </div>

        <div class="card income">

            <i class="fa-solid fa-arrow-trend-up card-icon"></i>

            <p>Total Income</p>

            <h2>₹ <span id="income">0</span></h2>

        </div>

        <div class="card expense">

            <i class="fa-solid fa-arrow-trend-down card-icon"></i>

            <p>Total Expense</p>

            <h2>₹ <span id="expense">0</span></h2>

        </div>

    </section>

    <!-- Add Transaction -->

    <section class="add-section">

        <h2>Add Transaction</h2>

        <div class="form">

            <input
                type="text"
                id="description"
                placeholder="Description">

            <input
                type="number"
                id="amount"
                placeholder="Amount">

            <select id="category">
                <option value="Food">🍔 Food</option>
                <option value="Travel">🚗 Travel</option>
                <option value="Shopping">🛍 Shopping</option>
                <option value="Bills">💡 Bills</option>
                <option value="Entertainment">🎬 Entertainment</option>
                <option value="Other">📦 Other</option>
            </select>

            <input type="date" id="date">

            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

        </div>

        <button id="addBtn">
            <i class="fa-solid fa-plus"></i>
            Add Transaction
        </button>

    </section>

    <!-- Search -->

    <section class="tools">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search transaction">

        <select id="filter">

            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>

        </select>

    </section>

    <!-- Analytics -->

    <section class="dashboard-grid">

        <div class="chart-card">

            <h2>
                <i class="fa-solid fa-chart-pie"></i>
                Expense Breakdown
            </h2>

            <canvas id="expenseChart"></canvas>

        </div>

        <div class="history">

            <div class="history-top">

                <h2>

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    Recent Transactions

                </h2>

                <button id="clearAllBtn">

                    <i class="fa-solid fa-trash-can"></i>

                    Clear All

                </button>

            </div>

            <ul id="transactionList"></ul>

        </div>

    </section>

    <footer>

        Designed & Developed by <strong>Shaikh Rozena</strong> 💙

    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
